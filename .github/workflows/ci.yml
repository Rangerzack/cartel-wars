name: CI
on: [push, pull_request]
jobs:
  db:
    name: SQL smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Postgres client tools
        run: sudo apt-get update -q && sudo apt-get install -y -q postgresql postgresql-contrib
      - name: Run migrations + smoke test
        run: |
          PGBIN=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          sudo -u postgres env PGBIN=$PGBIN PGDATA_DIR=/tmp/cartel-pg bash scripts/local-db.sh test
  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
