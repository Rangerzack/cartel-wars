<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-title" content="Cartel Wars" />
    <title>Cartel Wars</title>
    <script>
      // GitHub Pages SPA fallback: 404.html bounces deep links here as ?r=<path>; restore it before the app boots.
      (function () {
        var m = location.search.match(/[?&]r=([^&]*)/)
        if (m) {
          var base = location.pathname.replace(/\/?$/, '/')
          history.replaceState(null, '', base + decodeURIComponent(m[1]).replace(/^\//, ''))
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
